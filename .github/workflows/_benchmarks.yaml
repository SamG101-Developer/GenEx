# Compare GenEx's performance to range-v3's, and to the baseline
# in benchmarks/baseline.json. Called by pr.yaml. See
# benchmarks/check_ratios.py for what is checked, and why it uses
# ratios: raw times from a shared runner mean very little.
#
# One compiler is enough: this is here to catch a view or an
# action getting slower, and that rarely depends on the compiler.
# It has its own job as other work on the runner distorts results.
#
# The architecture is set explicitly, as what the compiler defaults
# to depends on which Ubuntu variant it was installed from: the
# runners use amd64v3, which gets AVX2 where plain amd64 gets none,
# and that decides which loops are vectorized. To match this job
# locally, configure with -DCMAKE_CXX_FLAGS=-march=x86-64-v3.
#
# Loops are aligned to a cache line, as they otherwise land at
# either the start or the middle of one depending on the size of
# whatever comes before them. A loop that crosses a line can be 30%
# slower on the runners' AMD CPUs than the same loop that doesn't,
# so without this an unrelated edit could fail or pass a pair.
#
# To update the baseline, take baseline.json from this job's
# artifact and commit it to benchmarks/ with the change that moved
# the numbers, where it can be reviewed like anything else.

name: benchmarks

on:
  workflow_call: { }

permissions: { }

jobs:
  benchmarks:
    name: Compare to range-v3
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Linux keeps sudo to install GCC, as in _build.yaml.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout GenEx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install gcc
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get install --yes g++-16 libbenchmark-dev librange-v3-dev
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGENEX_BUILD_BENCHMARKS=ON \
            "-DCMAKE_CXX_FLAGS=-march=x86-64-v3 -falign-loops=64 -falign-jumps=64"
          cmake --build build --parallel --target GenExBenchmark

      # The versions go in with the results, as a baseline is only
      # comparable to a run made with the same ones.
      - name: Compare
        run: |
          compiler=$("$CXX" -dumpfullversion)
          range_v3=$(dpkg-query --showformat='${Version}' --show librange-v3-dev)
          python3 benchmarks/check_ratios.py \
            --binary build/benchmarks/GenExBenchmark \
            --output baseline.json \
            --compiler "gcc-$compiler" \
            --range-v3 "$range_v3"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark-baseline
          path: baseline.json
          if-no-files-found: warn
          retention-days: 14
